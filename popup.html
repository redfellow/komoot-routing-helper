<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Routing Buddy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>MTB trail rules</h1>
      <p class="intro">Choose how each singletrail scale is shown in the Route Planner.</p>
      <label class="setting" for="minimumLevel">
        <span>Maximum trail level to show</span>
        <select id="maximumLevel">
          <option value="S0">S0 only</option>
          <option value="S1">S0–S1</option>
          <option value="S2">S0–S2</option>
          <option value="S3">S0–S3</option>
          <option value="S4">S0–S4</option>
          <option value="S5">S0–S5 — all marked trails</option>
        </select>
      </label>
      <div id="rules" aria-label="MTB difficulty rules"></div>
      <p class="hint"><span class="avoid-dot"></span> Avoid marks a level dark red. It is a visual warning, not a routing restriction.</p>
      <label class="checkbox-setting"><input id="rememberLayers" type="checkbox"> <span>Remember layer settings</span></label>
      <p class="hint">Restore your last selected map type, sport-specific map, and heatmap when the planner opens.</p>
      <button id="restore" type="button">Restore suggested rules</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
